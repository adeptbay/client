<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="AdeptBay">
  <defs>
    <linearGradient id="ab-icon" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1BAE9A"/>
      <stop offset="1" stop-color="#0E6A62"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#ab-icon)"/>
  <!-- The bay: a sheltering ring open to the east. -->
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#fff" stroke-width="3.6"
          stroke-linecap="round" stroke-dasharray="34.03 13.09" stroke-dashoffset="-6.55"/>
  <!-- The vessel making harbour. -->
  <circle cx="25" cy="16" r="2.2" fill="#fff"/>
</svg>
